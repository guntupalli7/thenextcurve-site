<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Next Curve | Future Tech & Wealth Stories</title>
    <meta name="description" content="Inside the high-stakes world of future technology and the stories of wealth that shape our world. From The Next Curve.">
    <style>
        :root {
            --bg: #0a0a0a;
            --accent: #ffffff;
            --text-secondary: #888;
            --card-bg: #161616;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--accent);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 500px;
            padding: 40px 20px;
        }

        .logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            margin-bottom: 24px;
            object-fit: cover;
        }

        h1 {
            font-size: 28px;
            letter-spacing: -1px;
            margin: 0 0 12px 0;
            text-transform: uppercase;
        }

        p {
            color: var(--text-secondary);
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 32px;
        }

        .cta-button {
            display: block;
            background: var(--accent);
            color: var(--bg);
            text-decoration: none;
            padding: 18px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 18px;
            transition: transform 0.2s, opacity 0.2s;
            margin-bottom: 12px;
        }

        .cta-button:hover {
            transform: scale(1.02);
            opacity: 0.9;
        }

        .secondary-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            border-bottom: 1px solid transparent;
            transition: border 0.2s;
        }

        .secondary-link:hover {
            border-bottom: 1px solid var(--text-secondary);
        }

        footer {
            margin-top: 60px;
            font-size: 12px;
            color: #444;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="logo.jpg" alt="The Next Curve Logo" class="logo">

        <h1>The Next Curve</h1>
        
        <p>
            Future Tech. Wealth Stories. High-Stakes Documentaries. <br>
            Deconstructing the curves that define the next decade.
        </p>

        <a href="https://www.youtube.com/@TheNextCurveOfficial" class="cta-button">Watch the Documentaries</a>

        <a href="mailto:henextcurve.official@gmail.com" class="secondary-link">Business Inquiries</a>

        <footer>
            PHASE 1: VIRAL VELOCITY
        </footer>
    </div>

</body>
</html>
